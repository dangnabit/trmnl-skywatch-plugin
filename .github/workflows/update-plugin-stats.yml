name: Update Plugin Stats in README

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-plugin-stats.yml'
      - 'scripts/update_plugin_stats.sh'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y jq file coreutils

      - name: Update README with plugin stats
        run: bash scripts/update_plugin_stats.sh

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "📊 Update plugin statistics in README"
          commit_author: "GitHub Actions <actions@github.com>"
